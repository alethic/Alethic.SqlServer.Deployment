name: Alethic.SqlServer.Deployment

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to nuget.org, creating the GitHub release if one does not exist.
        type: boolean
        default: false
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  release:
    types:
    - created

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
    - name: NuGet Restore
      run: dotnet restore Alethic.SqlServer.Deployment.sln
    - name: Build
      shell: pwsh
      run: |
        dotnet msbuild /m /bl `
          /p:Configuration="Release" `
          /p:Platform="Any CPU" `
          /p:Version=${env:GitVersion_FullSemVer} `
          /p:AssemblyVersion=${env:GitVersion_AssemblySemVer} `
          /p:InformationalVersion=${env:GitVersion_InformationalVersion} `
          /p:FileVersion=${env:GitVersion_AssemblySemFileVer} `
          /p:PackageVersion=${env:GitVersion_FullSemVer} `
          /p:RepositoryType=git `
          /p:RepositoryUrl="${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" `
          /p:PackageProjectUrl="${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}" `
          /p:BuildInParallel=true `
          /p:ContinuousIntegrationBuild=true `
          Alethic.SqlServer.Deployment.dist.msbuildproj
    - name: Upload MSBuild Log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: msbuild.binlog
        path: msbuild.binlog
    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: dist/nuget
    - name: Package Tests
      run: tar czvf tests.tar.gz tests
      working-directory: dist
    - name: Upload Tests
      uses: actions/upload-artifact@v7
      with:
        name: tests
        path: dist/tests.tar.gz
  test:
    strategy:
      fail-fast: false
      matrix:
        run:
        - Alethic.SqlServer.Deployment.Tests
        # The tests deploy to LocalDB, which runs on Windows alone.
        sys:
        - win-x64
        tfm:
        - net472
        - net8.0
    name: Test (${{ matrix.run }}:${{ matrix.tfm }}:${{ matrix.sys }})
    needs:
    - build
    runs-on: ${{ fromJSON('{"win-x64":["windows-2022"]}')[matrix.sys] }}
    steps:
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Download Tests
      uses: actions/download-artifact@v8
      with:
        name: tests
    - name: Restore Tests
      run: tar xzvf tests.tar.gz
    - name: Execute Tests
      timeout-minutes: 480
      shell: pwsh
      run: |
        # assign powershell variables
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"
        $sys = "${{ matrix.sys }}"

        # suite name can contain filter expression after ?
        $split = $run.IndexOf("?")
        if ($split -gt -1) {
            $tst = $run.Substring(0, $split)
            $qry = $run.Substring($split + 1)
        } else {
            $tst = $run
        }

        # scan and process test assemblies; on .NET Framework the suite is an executable of its own
        $tests = $(gi .\tests\$tst\$tfm\*.Tests.dll -ErrorAction SilentlyContinue)
        $exe = $(gi .\tests\$tst\$tfm\*.Tests.exe -ErrorAction SilentlyContinue)
        if (-not $tests -and $exe) {
            $argl = @("--results-directory", "TestResults", "--report-trx")
            if ($qry -ne "" -and $qry -ne $null) {
                $argl += @("--filter", $qry)
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst-$qry--$tfm--$sys"
            } else {
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst--$tfm--$sys"
            }

            & $exe[0].FullName @argl
            exit $LASTEXITCODE
        }

        if ($tests) {
            $argl = @(
                "-f", $tfm,
                "-v:diag",
                "--results-directory", "TestResults",
                "--logger:console;verbosity=diag",
                "--logger:trx"
            )

            $runsettings = $(gi .\tests\$tst\$tfm\*.runsettings)
            if ($runsettings) {
                $argl += "--settings:$runsettings"
            }

            if ($qry -ne "" -and $qry -ne $null) {
                $argl += @("--filter", $qry)
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst-$qry--$tfm--$sys"
            } else {
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst--$tfm--$sys"
            }

            dotnet test @argl $tests[0].FullName
        }
    - name: Archive Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      run: tar czvf TestResults.tar.gz TestResults
    - name: Upload Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RET }}
        path: TestResults.tar.gz
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs:
    - test
    runs-on: ubuntu-latest
    # id-token lets the NuGet login step trade the job's OIDC token for a short-lived nuget.org API key.
    # Naming any permission drops the others to none, so the release needs contents listed.
    permissions:
      contents: write
      id-token: write
    env:
      # Gates both the GitHub release and the nuget.org push: true for a tag build or a manual run that
      # asks to publish.
      PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      id: GitVersion
      uses: gittools/actions/gitversion/execute@v4
    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget
        path: dist/nuget
    # `commit` lets the action create the tag when it does not exist. When the release already exists
    # (a tag build or a re-run) it is updated in place, keeping hand-written notes and replacing the
    # packages.
    - name: Create Release
      if: env.PUBLISH == 'true'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.GitVersion.outputs.semVer }}
        commit: ${{ github.sha }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        replacesArtifacts: true
        artifacts: dist/nuget/*.nupkg,dist/nuget/*.snupkg
        prerelease: ${{ contains(steps.GitVersion.outputs.semVer, '-') }}
        makeLatest: ${{ !contains(steps.GitVersion.outputs.semVer, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}
    # Trusted publishing: no stored key. NUGET_USER is the nuget.org username, not an organization, that
    # created the trusted publishing policy for this repository and workflow.
    - name: NuGet Login
      if: env.PUBLISH == 'true'
      id: NuGetLogin
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    # --skip-duplicate makes pushing a version nuget.org already has a no-op.
    - name: Push NuGet
      if: env.PUBLISH == 'true'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:NUGET_REPOS --api-key $env:NUGET_TOKEN --skip-duplicate
      env:
        NUGET_REPOS: https://api.nuget.org/v3/index.json
        NUGET_TOKEN: ${{ steps.NuGetLogin.outputs.NUGET_API_KEY }}
